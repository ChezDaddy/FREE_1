<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"/><title>Debug DaddyBaux</title></head>
<body>
<h2>Debug GitHub Pages</h2>
<pre id="out" style="background:#f0f0f0;padding:16px;font-size:12px;white-space:pre-wrap"></pre>

<script>
var out = document.getElementById('out');
function log(msg) { out.textContent += msg + '\n'; }

log('=== 1. JS chargé : OK ===');

// Test onclick
log('=== 2. Test window functions ===');
function testFn() { log('testFn appelée : OK'); }
window.testFn = testFn;
log('window.testFn défini : ' + (typeof window.testFn));

// Test crypto.subtle
log('=== 3. crypto.subtle ===');
if (window.crypto && window.crypto.subtle) {
  log('crypto.subtle : disponible');
  crypto.subtle.digest('SHA-256', new TextEncoder().encode('test'))
    .then(function(buf) {
      var hex = Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
      log('SHA-256("test") = ' + hex.slice(0,20) + '...');
      log('crypto.subtle : FONCTIONNE');
    })
    .catch(function(e) { log('crypto.subtle ERREUR : ' + e); });
} else {
  log('crypto.subtle : NON DISPONIBLE ← PROBLÈME');
}

// Test localStorage
log('=== 4. localStorage ===');
try {
  localStorage.setItem('_test', '1');
  localStorage.removeItem('_test');
  log('localStorage : OK');
} catch(e) { log('localStorage BLOQUÉ : ' + e); }

// Test sessionStorage
log('=== 5. sessionStorage ===');
try {
  sessionStorage.setItem('_test', '1');
  sessionStorage.removeItem('_test');
  log('sessionStorage : OK');
} catch(e) { log('sessionStorage BLOQUÉ : ' + e); }

// Test async/await
log('=== 6. async/await ===');
async function testAsync() {
  return 'async OK';
}
testAsync().then(function(r) { log('async/await : ' + r); });

// Test classList
log('=== 7. classList ===');
var d = document.createElement('div');
d.classList.add('hidden');
d.classList.remove('hidden');
log('classList : OK');

// Test fetch (Supabase)
log('=== 8. fetch ===');
log('fetch disponible : ' + (typeof fetch !== 'undefined'));

log('\n=== RÉSUMÉ : copie ce texte et envoie-le ===');
</script>

<button onclick="testFn()">Test onclick</button>
<p id="onclickResult"></p>
<script>
function testFn2() {
  document.getElementById('onclickResult').textContent = '✅ onclick fonctionne';
}
window.testFn2 = testFn2;
</script>
<button onclick="testFn2()">Test onclick 2</button>
</body>
</html>
